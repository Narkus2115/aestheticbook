<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gesichtsanalyse Selbsttest</title>
<style>
:root{--brand:#7a4b5c;--muted:#6e6468;--line:#e4dde0;--text:#1f1a1c;--bg:#f2eff0}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:20px;margin:0 0 12px}
.card{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
button,label.btn{display:inline-flex;align-items:center;min-height:44px;padding:9px 14px;border:0;border-radius:8px;font:inherit;font-weight:600;background:var(--brand);color:#fff;cursor:pointer}
input[type=file]{display:none}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#faf5f6;padding:8px;border-radius:8px;max-height:260px;overflow:auto}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.grid{grid-template-columns:1.2fr 1fr}}
canvas{width:100%;height:auto;border-radius:8px;background:#ddd;display:block}
#st{font-weight:600}
</style>
</head>
<body>
<h1>Gesichtsanalyse: Selbsttest</h1>
<div class="card">
  <p id="st">Noch nicht geladen.</p>
  <button id="load" type="button">Modul laden</button>
  <label class="btn" for="file" style="margin-left:8px">Foto wählen</label>
  <input id="file" type="file" accept="image/*">
  <pre id="log"></pre>
</div>
<div class="grid">
  <div class="card"><canvas id="cv" width="10" height="10"></canvas></div>
  <div class="card" id="out"></div>
</div>
<script src="../../face.js"></script>
<script>
(function () {
  var logEl = document.getElementById("log"), st = document.getElementById("st");
  function log(s) { logEl.textContent += s + "\n"; }
  log("UA: " + navigator.userAgent);
  if (!window.ABFace) { st.textContent = "face.js nicht geladen."; return; }
  log("isSupported: " + ABFace.isSupported());
  function doLoad() {
    st.textContent = "Lädt ...";
    var t0 = Date.now();
    return ABFace.load().then(function (r) {
      var s = ABFace._math.state();
      st.textContent = r.ok ? "Bereit (" + (Date.now() - t0) + " ms, SIMD " + (s.simd ? "ja" : "nein") + ")" : "Fehler: " + r.reason;
      log("load: " + JSON.stringify(r) + " state: " + JSON.stringify(s));
      return r;
    });
  }
  document.getElementById("load").onclick = doLoad;
  document.getElementById("file").onchange = function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var url = rd.result;
      st.textContent = "Analysiert ...";
      ABFace.analyze(url).then(function (r) {
        log("analyze: ok=" + r.ok + " " + (r.reason || "") + " " + (r.detail || "") + " " + r.durationMs + " ms");
        if (!r.ok) { st.textContent = r.reason; return; }
        st.textContent = "Fertig (" + r.durationMs + " ms)";
        var im = new Image();
        im.onload = function () {
          var cv = document.getElementById("cv"), s = Math.min(1, 1400 / Math.max(r.width, r.height));
          cv.width = Math.round(r.width * s); cv.height = Math.round(r.height * s);
          ABFace.drawOverlay(cv, r, { image: im });
        };
        im.src = url;
        document.getElementById("out").innerHTML = ABFace.renderMetricsHtml(r.metrics);
        log(JSON.stringify(r.metrics, null, 1));
      });
    };
    rd.readAsDataURL(f);
  };
})();
</script>
</body>
</html>
